<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-link"></i></div>
        <div>
          <h1>Shortener Pro</h1>
          <span>Secure link management</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
      </div>
    </header>

    <div class="card">
      <div class="input-group">
        <label for="urlInput">Destination URL</label>
        <input type="url" id="urlInput" placeholder="https://example.com/your-very-long-url" autofocus />
        <div class="validation-feedback" id="urlFeedback"></div>
      </div>

      <button class="advanced-toggle" id="advancedToggle" type="button">
        <i class="fas fa-chevron-right icon"></i> Advanced options
      </button>
      <div class="advanced-content" id="advancedContent">
        <div class="input-group">
          <label for="aliasInput">Custom alias (optional)</label>
          <input type="text" id="aliasInput" placeholder="my-custom-link" maxlength="30" />
          <div class="validation-feedback" id="aliasFeedback"></div>
        </div>
        <div class="input-group">
          <label for="expiresInput">Expires at (optional)</label>
          <input type="datetime-local" id="expiresInput" />
        </div>
      </div>

      <div class="result-card" id="resultCard">
        <div class="result-label">Your shortened URL</div>
        <a class="result-url" id="resultUrl" href="#" target="_blank"></a>
        <div class="result-actions">
          <button class="btn btn-sm btn-primary" id="copyResultBtn"><i class="fas fa-copy"></i> Copy</button>
          <button class="btn btn-sm btn-secondary" id="qrResultBtn"><i class="fas fa-qrcode"></i> QR</button>
        </div>
      </div>

      <button class="btn btn-primary btn-full" id="shortenBtn"><i class="fas fa-bolt"></i> Shorten URL</button>
    </div>

    <div class="card">
      <h3 style="margin-bottom:16px"><i class="fas fa-list"></i> Your Links</h3>
      <div class="empty-state" id="emptyState" style="display:none">
        <i class="fas fa-link"></i>
        <p>No links yet. Shorten your first URL above!</p>
      </div>
      <div id="linksWrap"></div>
    </div>

    <footer style="text-align:center;padding:24px 0 12px;color:var(--c-text-2);font-size:0.8rem">
      URL Shortener Pro &mdash; Built with ASP.NET Core &amp; EF Core
    </footer>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close modal"><i class="fas fa-times"></i></button>
      <h3 id="modalTitle"></h3>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
